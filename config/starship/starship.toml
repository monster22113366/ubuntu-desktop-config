# Starship — Tokyo Night Storm, adapted from the existing user configuration.
"$schema" = 'https://starship.rs/config-schema.json'

# Three rows: identity, location / Git, then active environment and input.
format = """
[╭─ ](fg:#565f89)$username[ · ](fg:#565f89)$hostname$cmd_duration
[│  ](fg:#565f89)$directory$git_branch$git_commit$git_state$git_status
[╰─ ](fg:#565f89)$all$character"""
# Keep default context modules available so new environments are not silently lost.
# Explicit modules above are excluded from $all automatically.
right_format = ""

[line_break]
disabled = true

[username]
show_always = true
style_user = "bold fg:#7aa2f7"
style_root = "bold fg:#f7768e"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "fg:#bb9af7"
format = "[$hostname]($style)"

[directory]
style = "bold fg:#7dcfff"
format = "[$path]($style)[$read_only]($read_only_style)[ ]($style)"
truncation_length = 0
truncate_to_repo = false
# Keep the full home path; update this when deploying to another account.
home_symbol = "/home/monster"
read_only = " 󰌾"
read_only_style = "fg:#f7768e"

[git_branch]
symbol = "⎇ "
style = "fg:#9ece6a"
format = "[ · ](fg:#565f89)[$symbol$branch ]($style)"

[git_commit]
only_detached = true
style = "fg:#9ece6a"
format = '[ commit $hash ]($style)'

[git_state]
style = "bold fg:#e0af68"
format = '[ $state( $progress_current/$progress_total) ]($style)'

[git_status]
style = "fg:#e0af68"
format = '([\[$all_status$ahead_behind\] ]($style))'
conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "$${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[python]
# Escaped parentheses are literal; the outer group hides an inactive venv.
format = '([\($virtualenv\)]($style) )'
style = "bold fg:#e0af68"

[conda]
ignore_base = false
format = '[\($environment\)]($style) '
style = "bold fg:#e0af68"

[cmd_duration]
min_time = 2000
show_milliseconds = false
style = "#e0af68"
format = " [took $duration]($style)"

[character]
success_symbol = "[>](bold #7aa2f7)"
error_symbol = "[>](bold #f7768e)"
vimcmd_symbol = "[<](bold #bb9af7)"

[package]
disabled = true
