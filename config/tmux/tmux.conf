# ==========================================
# General
# ==========================================

set -g mode-keys vi
set -g history-limit 50000
set -g mouse on
set-option -g focus-events on

set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-ghostty:RGB'

# Wayland system clipboard
set -s set-clipboard on


# ==========================================
# Esc: Shell -> Vim Copy Mode
# ==========================================

bind -n Escape if-shell -F \
    '#{||:#{==:#{pane_current_command},bash},#{||:#{==:#{pane_current_command},zsh},#{==:#{pane_current_command},fish}}}' \
    'copy-mode' \
    'send-keys Escape'


# ==========================================
# Vim Copy Mode
# ==========================================

# Exit copy mode
bind -T copy-mode-vi i send-keys -X cancel

# Visual selection
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Yank: tmux buffer + Wayland clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "~/.local/bin/tmux-clipboard-copy"

# Paste from tmux buffer
bind -T copy-mode-vi p send-keys -X cancel \; paste-buffer

# Paste in normal terminal mode (Prefix + p)
bind p paste-buffer

# ==========================================
# Window Management
# ==========================================

# Create and switch windows
bind c new-window
bind n next-window
bind p previous-window

# Split panes
bind | split-window -h
bind - split-window -v

# Close current pane
bind x kill-pane

# Toggle pane zoom
bind z resize-pane -Z

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# ==========================================
# Pane Resize - Vim Style
# ==========================================

# Resize panes with Prefix + Shift + H/J/K/L
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5


# ==========================================
# Quick Window Switching
# ==========================================

bind 0 select-window -t 0
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9

# 02.3: desktop resource status (keys and panes remain above).
source-file ~/.config/tmux/status.conf

# Kitty Graphics Protocol passthrough
set -g allow-passthrough on
