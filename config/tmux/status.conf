# Tokyo Night frosted capsules. Ghostty supplies cell opacity; Hyprland supplies blur.
set -g status-position bottom
set -g status-interval 5
set -g status-style 'bg=default,fg=#c0caf5'
set -g status-left-length 36
set -g status-left '#[fg=#{?#{==:#{pane_mode},copy-mode},#e0af68,#303958},bg=default]#[fg=#{?#{==:#{pane_mode},copy-mode},#1a1b26,#7aa2f7},bg=#{?#{==:#{pane_mode},copy-mode},#e0af68,#303958},bold] #{?#{==:#{pane_mode},copy-mode},#{?selection_active,#{?rectangle_toggle,V-BLOCK,VISUAL},COPY · VI},#S} #[fg=#{?#{==:#{pane_mode},copy-mode},#e0af68,#303958},bg=default,nobold]#[default] '
set -g window-status-separator ' '
set -g window-status-style 'bg=default,fg=#a9b1d6'
set -g window-status-format '#[fg=#292e42,bg=default]#[fg=#a9b1d6,bg=#292e42] #I #W#F #[fg=#292e42,bg=default]#[default]'
set -g window-status-current-format '#[fg=#{?#{==:#{pane_mode},copy-mode},#e0af68,#414868},bg=default]#[fg=#{?#{==:#{pane_mode},copy-mode},#1a1b26,#c0caf5},bg=#{?#{==:#{pane_mode},copy-mode},#e0af68,#414868},bold] #I #W#F #[fg=#{?#{==:#{pane_mode},copy-mode},#e0af68,#414868},bg=default,nobold]#[default]'
set -g status-right-length 120
set -g status-right '#(python3 "$HOME/.config/tmux/scripts/resources.py" --tmux) #[fg=#403747,bg=default]#[fg=#e0af68,bg=#403747] %H:%M %m-%d #[fg=#403747,bg=default]#[default] '
