
# ==========================================
# Hyprlock - Tokyo Night Storm
# ==========================================

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot

    color = rgba(36, 40, 59, 0.92)

    blur_passes = 3
    blur_size = 8

    noise = 0.02
    contrast = 0.9
    brightness = 0.8
}

# Time
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(192, 202, 245, 1.0)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgba(169, 177, 214, 1.0)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, -10
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 300, 55
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    outer_color = rgba(122, 162, 247, 0.9)
    inner_color = rgba(41, 46, 66, 0.9)
    font_color = rgba(192, 202, 245, 1.0)

    fade_on_empty = false
    placeholder_text = <span foreground="##a9b1d6">Enter password...</span>
    fail_text = <span foreground="##f7768e">Authentication failed</span>

    position = 0, -120
    halign = center
    valign = center
}

